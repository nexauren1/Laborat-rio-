name: Build NoteFlow demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noteflow-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Android demo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android and web platform scaffold
        run: flutter create --platforms=android,web --project-name noteflow --org com.noteflow /tmp/noteflow-build

      - name: Overlay NoteFlow source
        run: |
          cp pubspec.yaml /tmp/noteflow-build/pubspec.yaml
          cp analysis_options.yaml /tmp/noteflow-build/analysis_options.yaml
          rm -rf /tmp/noteflow-build/lib /tmp/noteflow-build/test
          cp -R lib /tmp/noteflow-build/lib
          cp -R test /tmp/noteflow-build/test
          mkdir -p /tmp/noteflow-build/android/app/src/main
          cp android/app/src/main/AndroidManifest.xml /tmp/noteflow-build/android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        working-directory: /tmp/noteflow-build
        run: flutter pub get

      - name: Format Dart source
        working-directory: /tmp/noteflow-build
        run: dart format lib test

      - name: Analyze Dart source
        working-directory: /tmp/noteflow-build
        run: flutter analyze --no-pub

      - name: Run widget tests
        working-directory: /tmp/noteflow-build
        run: flutter test --no-pub

      - name: Build installable Android demo APK
        working-directory: /tmp/noteflow-build
        run: flutter build apk --release --dart-define=DEMO_MODE=true

      - name: Build web preview
        working-directory: /tmp/noteflow-build
        run: flutter build web --release --dart-define=DEMO_MODE=true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NoteFlow-Android-Demo-APK
          path: /tmp/noteflow-build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload web preview
        uses: actions/upload-artifact@v4
        with:
          name: NoteFlow-Web-Demo
          path: /tmp/noteflow-build/build/web/
          if-no-files-found: error
          retention-days: 14
